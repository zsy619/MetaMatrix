name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pros/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pros/api/go.mod
      - run: go test ./internal/...
      - run: go build -o /tmp/metamatrix-api ./cmd/server

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pros/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pros/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types src/components/workspace/statsNormalize.test.ts
